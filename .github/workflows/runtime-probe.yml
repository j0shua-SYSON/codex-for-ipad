name: Real iSH runtime probe
on:
  workflow_call:
    inputs:
      artifact_run_id:
        required: true
        type: string
      expected_revision:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful compatibility run containing codexpad-runtime-i686
        required: true
        type: string
      expected_revision:
        description: Optional exact Codex revision to require in the runtime
        type: string
permissions:
  contents: read
  actions: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26]
        include:
          - runner: macos-26
            sanitizer: address
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: codexpad-runtime-i686
          path: artifacts/runtime
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Install Linux probe dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev meson ninja-build gdb python3-websocket
          echo "PROBE_PYTHON=/usr/bin/python3" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.core_pattern="$GITHUB_WORKSPACE/artifacts/core.%p"
      - name: Install Darwin probe dependencies
        if: runner.os == 'macOS'
        run: |
          brew install llvm lld ninja libarchive meson coreutils
          python3 -m venv artifacts/probe-venv
          artifacts/probe-venv/bin/pip install websocket-client==1.9.0
          echo "PROBE_PYTHON=$GITHUB_WORKSPACE/artifacts/probe-venv/bin/python3" >> "$GITHUB_ENV"
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Build the actual iSH emulator
        run: |
          meson setup build -Dengine=asbestos -Dkernel=ish -Dbuildtype=debug -Dlog=strace -Dlog_handler=stderr -Db_sanitize="${{ matrix.sanitizer || 'none' }}"
          ninja -C build
          build/uname_test
      - name: Exercise SSE instructions and masked futex waits
        shell: bash
        run: |
          ulimit -c unlimited
          mkdir -p artifacts/instruction-test
          for test in movmskps vector-alias futex-bitset process-lifecycle thread-parent socketpair poll-files epoll-oneshot; do
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              clang -target i386-linux -c "tests/codexpad/$test.S" -o "artifacts/instruction-test/$test.o"
              ld.lld -m elf_i386 "artifacts/instruction-test/$test.o" -o "artifacts/instruction-test/$test"
              llvm-objdump -d "artifacts/instruction-test/$test" >> artifacts/instruction-disassembly.txt
            else
              as --32 "tests/codexpad/$test.S" -o "artifacts/instruction-test/$test.o"
              ld -m elf_i386 "artifacts/instruction-test/$test.o" -o "artifacts/instruction-test/$test"
              objdump -d "artifacts/instruction-test/$test" >> artifacts/instruction-disassembly.txt
            fi
            timeout 15 build/ish -r artifacts/instruction-test "/$test"
            echo "PASS: real iSH $test regression"
          done
      - name: Import and execute packaged guest
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
        run: |
          set -euo pipefail
          ulimit -c unlimited
          tar -xOf artifacts/runtime/codexpad-rootfs.tar.gz ./usr/local/share/codexpad/runtime.json | tee artifacts/runtime-manifest.json
          revision="${EXPECTED_REVISION:-$(jq -r '.codex.revision' Dependencies/upstreams.json)}"
          jq -e --arg revision "$revision" '.codexRevision == $revision' artifacts/runtime-manifest.json
          build/tools/fakefsify artifacts/runtime/codexpad-rootfs.tar.gz artifacts/guest
          timeout 30 build/ish -f artifacts/guest /bin/busybox echo ISH_BASELINE_OK
          timeout 60 build/ish -f artifacts/guest /usr/local/libexec/codexpad/codex-app-server --help
          "$PROBE_PYTHON" scripts/probe-ish-runtime.py --ish build/ish --root artifacts/guest --stderr-log artifacts/guest-syscalls.log | tee artifacts/runtime-probe.log
          "$PROBE_PYTHON" scripts/probe-ish-runtime.py --ish build/ish --root artifacts/guest --transport websocket --stderr-log artifacts/guest-websocket.log | tee artifacts/websocket-probe.log
          "$PROBE_PYTHON" scripts/probe-ish-runtime.py --ish build/ish --root artifacts/guest --transport websocket --startup init --stderr-log artifacts/guest-boot.log | tee artifacts/boot-probe.log
      - name: Diagnose guest crash
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: |
          if test -f artifacts/guest-syscalls.log; then
            grep -E 'clone\(|prctl\(|setsid\(|execve\(| = -22|panicked at|assertion' artifacts/guest-syscalls.log | tail -100 || true
          fi
          if test -f artifacts/runtime-probe.log; then
            tar -xOf artifacts/runtime/codexpad-rootfs.tar.gz ./usr/local/libexec/codexpad/codex-app-server > artifacts/guest-app-server
            fault="$(sed -n 's/.*illegal instruction at \(0x[0-9a-f]*\):.*/\1/p' artifacts/runtime-probe.log | tail -1)"
            if test -n "$fault"; then
              addr2line -Cfipe artifacts/guest-app-server "$fault" | tee artifacts/guest-symbols.txt
              objdump -d --start-address="$((fault - 96))" --stop-address="$((fault + 96))" artifacts/guest-app-server >> artifacts/guest-symbols.txt
            fi
          fi
          for core in artifacts/core.*; do
            test -f "$core" || continue
            gdb -batch build/ish "$core" \
              -ex 'thread apply all bt' \
              -ex 'p current->cpu' \
              -ex 'p current->group->exit_code' \
              > artifacts/guest-backtrace.txt 2>&1 || true
          done
      - name: Diagnose Darwin host trap
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p artifacts/darwin-diagnostics
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 -type f \
            -name 'ish*' -exec cp '{}' artifacts/darwin-diagnostics/ \; || true
          timeout 60 lldb --batch \
            -o run -k 'thread backtrace all' -k 'register read' \
            -- build/ish -f artifacts/guest /bin/sh -lc 'echo SHELL_OK' \
            > artifacts/darwin-diagnostics/lldb.txt 2>&1 || true
          # Diagnose the actual concurrent Codex workload, not only /bin/sh.
          for attempt in 1 2 3; do
            timeout 180 "$PROBE_PYTHON" scripts/probe-ish-runtime.py \
              --ish build/ish --root artifacts/guest --transport websocket --debugger-lldb \
              --stderr-log "artifacts/darwin-diagnostics/syscalls-$attempt.log" \
              > "artifacts/darwin-diagnostics/codex-lldb-$attempt.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Real-iSH-runtime-evidence-${{ runner.os }}${{ matrix.sanitizer && '-ASan' || '' }}
          path: |
            artifacts/runtime-probe.log
            artifacts/runtime-manifest.json
            artifacts/guest-backtrace.txt
            artifacts/instruction-disassembly.txt
            artifacts/guest-symbols.txt
            artifacts/guest-syscalls.log
            artifacts/guest-websocket.log
            artifacts/websocket-probe.log
            artifacts/guest-boot.log
            artifacts/boot-probe.log
            artifacts/darwin-diagnostics/
