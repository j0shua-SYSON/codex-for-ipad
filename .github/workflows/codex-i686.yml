name: Codex i686 compatibility

on:
  workflow_call:
    inputs:
      codex_revision:
        description: Exact openai/codex commit to test
        required: true
        type: string
      rust_toolchain:
        description: Rust toolchain required by that Codex revision
        required: true
        type: string
  workflow_dispatch:
    inputs:
      runtime_artifact_run_id:
        description: Reuse a previously built runtime for verified app repackaging
        required: false
        type: string
      repackage_runtime:
        description: Rebuild Alpine around the verified binary from that runtime
        required: false
        default: false
        type: boolean
      codex_revision:
        description: Optional openai/codex commit override
        required: false
        type: string
      rust_toolchain:
        description: Optional Rust toolchain override
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/codex-i686.yml"
      - "Dependencies/upstreams.json"
      - "scripts/build-codex-i686.sh"
      - "scripts/package-runtime-rootfs.sh"
      - "scripts/validate-codex-protocol.py"
      - "scripts/probe-ish-runtime.py"
      - ".github/workflows/runtime-probe.yml"
      - ".github/workflows/native-regression.yml"
      - "tests/codexpad/**"
      - "emu/**"
      - "kernel/**"
      - "fs/**"
      - "util/**"
      - "meson.build"
      - "compat/**"
      - "patches/**"
      - "runtime/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/codex-i686.yml"
      - "Dependencies/upstreams.json"
      - "scripts/build-codex-i686.sh"
      - "scripts/package-runtime-rootfs.sh"
      - "scripts/validate-codex-protocol.py"
      - "scripts/probe-ish-runtime.py"
      - ".github/workflows/runtime-probe.yml"
      - ".github/workflows/native-regression.yml"
      - "tests/codexpad/**"
      - "emu/**"
      - "kernel/**"
      - "fs/**"
      - "util/**"
      - "meson.build"
      - "compat/**"
      - "patches/**"
      - "runtime/**"

permissions:
  contents: read
  actions: read

jobs:
  native-regression:
    name: Verify native model behavior
    uses: ./.github/workflows/native-regression.yml

  app-server:
    if: inputs.runtime_artifact_run_id == ''
    name: Build Codex app-server for iSH
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      codex_revision: ${{ steps.resolve.outputs.codex_revision }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/artifacts/cargo-target
      CARGO_HOME: ${{ github.workspace }}/.codex-local/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.codex-local/rustup

    steps:
      - name: Check out CodexPad
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - id: resolve
        name: Resolve pinned upstreams
        shell: bash
        env:
          INPUT_CODEX_REVISION: ${{ inputs.codex_revision }}
          INPUT_RUST_TOOLCHAIN: ${{ inputs.rust_toolchain }}
          INPUT_REPACKAGE_RUNTIME: ${{ inputs.repackage_runtime }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_REPACKAGE_RUNTIME" == "true" ]]; then
            echo "Repackaging requires runtime_artifact_run_id." >&2
            exit 1
          fi
          revision="${INPUT_CODEX_REVISION:-$(jq -r '.codex.revision' Dependencies/upstreams.json)}"
          toolchain="${INPUT_RUST_TOOLCHAIN:-$(jq -r '.codex.rustToolchain' Dependencies/upstreams.json)}"
          target="$(jq -r '.codex.target' Dependencies/upstreams.json)"
          zig="$(jq -r '.tooling.zig' Dependencies/upstreams.json)"
          zigbuild="$(jq -r '.tooling.cargoZigbuild' Dependencies/upstreams.json)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$target" == "i686-unknown-linux-musl" ]]
          [[ "$zigbuild" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "CODEX_REVISION=$revision" >> "$GITHUB_ENV"
          echo "RUST_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "CODEX_TARGET=$target" >> "$GITHUB_ENV"
          echo "ZIG_VERSION=$zig" >> "$GITHUB_ENV"
          echo "CARGO_ZIGBUILD_VERSION=$zigbuild" >> "$GITHUB_ENV"
          echo "codex_revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Fetch pinned Codex source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/codex
          git -C upstream/codex init
          git -C upstream/codex remote add origin https://github.com/openai/codex.git
          git -C upstream/codex fetch --depth=1 origin "$CODEX_REVISION"
          git -C upstream/codex checkout --detach FETCH_HEAD
          test "$(git -C upstream/codex rev-parse HEAD)" = "$CODEX_REVISION"

      - name: Cache compatible guest compilation inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            artifacts/cargo-target
            .codex-local/cargo/registry
            .codex-local/cargo/git
          key: ${{ runner.os }}-codex-i686-${{ env.RUST_TOOLCHAIN }}-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ hashFiles('patches/**', 'scripts/build-codex-i686.sh') }}-${{ env.CODEX_REVISION }}
          restore-keys: |
            ${{ runner.os }}-codex-i686-${{ env.RUST_TOOLCHAIN }}-${{ env.ZIG_VERSION }}-${{ env.CARGO_ZIGBUILD_VERSION }}-${{ hashFiles('patches/**', 'scripts/build-codex-i686.sh') }}-

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN" \
                --target "$CODEX_TARGET" --component rust-src
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Validate native protocol contract
        shell: bash
        run: >-
          python3 scripts/validate-codex-protocol.py
          upstream/codex/codex-rs/app-server-protocol/schema/json

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        shell: bash
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked

      - name: Install early guest-probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev meson ninja-build

      - name: Cross-compile app-server
        working-directory: upstream/codex/codex-rs
        shell: bash
        run: $GITHUB_WORKSPACE/scripts/build-codex-i686.sh

      - name: Inspect binary and protocol
        shell: bash
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/$CODEX_TARGET/release/codex-app-server"
          file "$binary" | tee artifacts/codex-app-server.file.txt
          test "$(od -An -tu1 -j4 -N1 "$binary" | tr -d ' ')" = "1"
          sha256sum "$binary" | tee artifacts/codex-app-server.sha256
          find upstream/codex/codex-rs/app-server-protocol/schema \
            -type f -print0 | sort -z | xargs -0 sha256sum \
            | sha256sum | tee artifacts/app-server-protocol.sha256

      - name: Stage app-server bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=artifacts/app-server-bundle
          mkdir -p "$bundle"
          install -m 0755 \
            "$CARGO_TARGET_DIR/$CODEX_TARGET/release/codex-app-server" \
            "$bundle/codex-app-server"
          cp artifacts/codex-app-server.sha256 \
            artifacts/codex-app-server.file.txt \
            artifacts/app-server-protocol.sha256 \
            "$bundle/"

      - name: Upload cross-compiled app-server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-app-server-i686-musl
          path: artifacts/app-server-bundle/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  runtime:
    name: Package pinned iSH runtime
    needs: app-server
    if: always() && (needs.app-server.result == 'success' || (inputs.runtime_artifact_run_id != '' && inputs.repackage_runtime))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CODEX_REVISION: ${{ needs.app-server.outputs.codex_revision || inputs.codex_revision }}

    steps:
      - name: Check out CodexPad
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve and fetch pinned Codex source
        shell: bash
        run: |
          set -euo pipefail
          revision="${CODEX_REVISION:-$(jq -r '.codex.revision' Dependencies/upstreams.json)}"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "CODEX_REVISION=$revision" >> "$GITHUB_ENV"
          mkdir -p upstream/codex
          git -C upstream/codex init
          git -C upstream/codex remote add origin https://github.com/openai/codex.git
          git -C upstream/codex fetch --depth=1 origin "$revision"
          git -C upstream/codex checkout --detach FETCH_HEAD
          test "$(git -C upstream/codex rev-parse HEAD)" = "$revision"
          test -f upstream/codex/LICENSE

      - name: Download verified app-server
        if: ${{ !inputs.repackage_runtime }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-app-server-i686-musl
          path: artifacts/app-server

      - name: Download previous runtime for repackaging
        if: inputs.repackage_runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codexpad-runtime-i686
          path: artifacts/previous-runtime
          run-id: ${{ inputs.runtime_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Extract the exact previously built app-server
        if: inputs.repackage_runtime
        shell: bash
        run: |
          set -euo pipefail
          previous=artifacts/previous-runtime/codexpad-rootfs.tar.gz
          tar -xOf "$previous" ./usr/local/share/codexpad/runtime.json \
            | jq -e --arg revision "$CODEX_REVISION" '.codexRevision == $revision'
          mkdir -p artifacts/app-server
          tar -xOf "$previous" ./usr/local/libexec/codexpad/codex-app-server \
            > artifacts/app-server/codex-app-server
          tar -xOf "$previous" ./usr/local/share/codexpad/codex-app-server.sha256 \
            > artifacts/app-server/codex-app-server.sha256

      - name: Verify app-server handoff
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/artifacts/app-server/codex-app-server"
          chmod 0755 "$binary"
          expected="$(cut -d ' ' -f1 artifacts/app-server/codex-app-server.sha256)"
          printf '%s  %s\n' "$expected" "$binary" | sha256sum --check --strict -
          file "$binary"

      - name: Package pinned Alpine runtime
        shell: bash
        env:
          CODEX_BINARY: ${{ github.workspace }}/artifacts/app-server/codex-app-server
          CODEX_SOURCE_DIR: ${{ github.workspace }}/upstream/codex
          OUTPUT_ROOTFS: ${{ github.workspace }}/artifacts/runtime/codexpad-rootfs.tar.gz
        run: $GITHUB_WORKSPACE/scripts/package-runtime-rootfs.sh

      - name: Inspect runtime image
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf artifacts/runtime/codexpad-rootfs.tar.gz \
            | grep -E '^\./(etc/init\.d/codexpad|etc/runlevels/default/codexpad|usr/local/libexec/codexpad/codex-app-server|usr/bin/git|usr/bin/rg)$'
          tar -xOf artifacts/runtime/codexpad-rootfs.tar.gz \
            ./usr/local/share/codexpad/runtime.json | jq -e \
            --arg revision "$CODEX_REVISION" '.codexRevision == $revision'

      - name: Upload iSH runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codexpad-runtime-i686
          path: artifacts/runtime/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14

  runtime-probe:
    name: Verify packaged Codex in the real iSH emulator
    needs: [app-server, runtime]
    if: always() && (needs.runtime.result == 'success' || (inputs.runtime_artifact_run_id != '' && !inputs.repackage_runtime))
    uses: ./.github/workflows/runtime-probe.yml
    with:
      artifact_run_id: ${{ inputs.repackage_runtime && format('{0}', github.run_id) || inputs.runtime_artifact_run_id || format('{0}', github.run_id) }}
      expected_revision: ${{ needs.app-server.outputs.codex_revision || inputs.codex_revision }}

  ipad-app:
    name: Build integrated CodexPad app
    needs: [runtime-probe, native-regression]
    # Runtime reuse intentionally skips compilation/package ancestors. Override
    # implicit success() propagation, but still require both verification gates.
    if: ${{ !cancelled() && needs.runtime-probe.result == 'success' && needs.native-regression.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out CodexPad
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Download verified runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codexpad-runtime-i686
          path: artifacts/runtime
          run-id: ${{ inputs.repackage_runtime && github.run_id || inputs.runtime_artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install iSH build dependencies
        shell: bash
        run: brew install llvm lld ninja libarchive meson

      - name: Build unsigned iPad app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -arch arm64 \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/artifacts/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODEXPAD_ROOTFS_PATH="$GITHUB_WORKSPACE/artifacts/runtime/codexpad-rootfs.tar.gz"
          app_path="$(find artifacts/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          test -f "$app_path/root.tar.gz"
          cmp "$app_path/root.tar.gz" artifacts/runtime/codexpad-rootfs.tar.gz
          # Keep current notices with the app even when an older runtime
          # artifact is deliberately reused after fresh compatibility checks.
          cp THIRD_PARTY_NOTICES.md "$app_path/THIRD_PARTY_NOTICES.md"
          tar -xOf "$app_path/root.tar.gz" ./usr/local/share/codexpad/runtime.json \
            > artifacts/runtime-manifest.json
          jq -n --arg appRevision "$GITHUB_SHA" \
            --arg runtimeRun '${{ inputs.repackage_runtime && github.run_id || inputs.runtime_artifact_run_id || github.run_id }}' \
            --arg runtimeSHA256 "$(shasum -a 256 "$app_path/root.tar.gz" | cut -d ' ' -f1)" \
            --slurpfile upstreams Dependencies/upstreams.json \
            --slurpfile runtime artifacts/runtime-manifest.json \
            '{schemaVersion: 1, appRevision: $appRevision, runtimeArtifactRun: $runtimeRun,
              runtimeSHA256: $runtimeSHA256, declaredUpstreams: $upstreams[0],
              runtime: $runtime[0]}' \
            > "$app_path/CodexPadBuild.json"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" artifacts/CodexPad-unsigned.app.zip

      - name: Upload unsigned iPad app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: CodexPad-unsigned-iPadOS
          path: artifacts/CodexPad-unsigned.app.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
