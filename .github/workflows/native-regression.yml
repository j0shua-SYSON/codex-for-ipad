name: Native model regression
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: Optional previous UI run to export for review
        type: string
      evidence_artifact:
        description: UI artifact name to export
        type: string
  push:
    paths: ["app/CodexPad/**", "tests/codexpad/**", ".github/workflows/native-regression.yml"]
  pull_request:
    paths: ["app/CodexPad/**", "tests/codexpad/**", ".github/workflows/native-regression.yml"]
permissions:
  contents: read
  actions: read
jobs:
  export-ui:
    if: inputs.evidence_run_id != '' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.evidence_artifact }}
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: saved
      - name: Export attachments and results
        run: |
          mkdir -p review
          xcrun xcresulttool export attachments --path saved/CodexPad-UI.xcresult --output-path review/attachments
          xcrun xcresulttool get test-results summary --path saved/CodexPad-UI.xcresult > review/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Reviewed-UI-evidence
          path: review
  model:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Compile and run production model regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp app/CodexPad/CodexClientRequest.schema.json artifacts/
          swiftc -parse-as-library \
            app/CodexPad/CodexJSON.swift app/CodexPad/CodexModels.swift \
            app/CodexPad/CodexRPC.swift app/CodexPad/CodexFeatureCatalog.swift \
            app/CodexPad/CodexWorkspaceModel.swift tests/codexpad/ModelRegression.swift \
            -o artifacts/model-regression
          artifacts/model-regression | tee artifacts/model-regression.log
      - name: Exercise the production Foundation WebSocket transport
        shell: bash
        run: |
          set -euo pipefail
          swiftc -parse-as-library app/CodexPad/CodexJSON.swift \
            app/CodexPad/CodexRPC.swift tests/codexpad/RPCRegression.swift \
            -o artifacts/rpc-regression
          python3 -m venv artifacts/rpc-fixture-env
          artifacts/rpc-fixture-env/bin/pip install websockets==15.0.1
          artifacts/rpc-fixture-env/bin/python tests/codexpad/rpc-fixture.py \
            artifacts/rpc-regression | tee artifacts/rpc-regression.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: Native-model-regression
          path: |
            artifacts/model-regression.log
            artifacts/rpc-regression.log
