name: Export saved UI evidence
on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: saved
      - name: Export screenshots and structured test results
        shell: bash
        run: |
          mkdir -p review
          xcrun xcresulttool export attachments --path saved/CodexPad-UI.xcresult --output-path review/attachments
          xcrun xcresulttool get test-results tests --path saved/CodexPad-UI.xcresult > review/tests.json
          xcrun xcresulttool get test-results summary --path saved/CodexPad-UI.xcresult > review/summary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Reviewed-UI-evidence
          path: review
